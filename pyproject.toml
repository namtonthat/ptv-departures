[project]
name = "ptv-departures"
version = "0.2.3"
description = "PTV Timetable API → Terminus Exchange JSON bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "gtfs-realtime-bindings>=1.0",
  "httpx>=0.27",
  "protobuf>=4.25",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptv_departures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
